<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#41718b"/></marker></defs><rect width="1460" height="800" fill="#f5f7fa"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="65" y="65" font-size="32" font-weight="600" fill="#172c40">T3 Code · 持久意图先于外部执行</text><text x="65" y="112" font-size="21" fill="#4d6170">虚线框：事件、投影、receipt、outbox 同一数据库事务</text><path d="M405 250H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="228" font-size="17" fill="#35576b">调用</text><path d="M845 250H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="228" font-size="17" fill="#35576b">提交计划</text><path d="M1115 320V385H235V443" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="510" y="373" font-size="17" fill="#35576b">commit 后发布</text><path d="M1115 320V385H675V443" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="905" y="373" font-size="17" fill="#35576b">持久工作</text><path d="M845 525H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="503" font-size="17" fill="#35576b">调用</text><rect x="65" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="225" font-size="24" font-weight="600" fill="#173d55">RPC 命令</text><text x="87" y="263" font-size="20" fill="#4d6170">commandId / threadId</text><rect x="505" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="527" y="225" font-size="24" font-weight="600" fill="#173d55">Orchestrator</text><text x="527" y="263" font-size="20" fill="#4d6170">状态决策与去重</text><rect x="945" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" stroke-dasharray="7 5"/><text x="967" y="225" font-size="24" font-weight="600" fill="#173d55">EventSink 事务</text><text x="967" y="263" font-size="20" fill="#4d6170">event + projection</text><text x="967" y="289" font-size="20" fill="#4d6170">receipt + outbox</text><rect x="65" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="500" font-size="24" font-weight="600" fill="#173d55">订阅客户端</text><text x="87" y="538" font-size="20" fill="#4d6170">提交后按序发布</text><rect x="505" y="455" width="340" height="140" rx="14" fill="#e8f2ed" stroke="#adbdc9" stroke-width="2" /><text x="527" y="500" font-size="24" font-weight="600" fill="#173d55">EffectWorker</text><text x="527" y="538" font-size="20" fill="#4d6170">claim / 执行 / 重试</text><rect x="945" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="500" font-size="24" font-weight="600" fill="#173d55">Provider / Git</text><text x="967" y="538" font-size="20" fill="#4d6170">外部副作用</text><line x1="65" y1="690" x2="1395" y2="690" stroke="#ccd6df"/><text x="65" y="730" font-size="21" fill="#3c5465">ack 只确认意图提交；provider turn 结束和 checkpoint 完成分别记录。</text><text x="65" y="770" font-size="17" fill="#6c7e8c">固定源码分析 · 实线箭头表示标注的调用或数据传递；图不表示真实时间比例。</text></g></svg>