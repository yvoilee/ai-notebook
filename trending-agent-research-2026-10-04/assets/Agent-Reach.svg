<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#41718b"/></marker></defs><rect width="1460" height="800" fill="#f5f7fa"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="65" y="65" font-size="32" font-weight="600" fill="#172c40">Agent Reach · 诊断路径与数据路径</text><text x="65" y="112" font-size="21" fill="#4d6170">doctor 检查接入状态；内容访问通常直接使用上游工具</text><path d="M405 250H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="228" font-size="17" fill="#35576b">调用</text><path d="M845 250H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="228" font-size="17" fill="#35576b">聚合</text><path d="M405 525H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="503" font-size="17" fill="#35576b">直接调用</text><path d="M845 525H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="503" font-size="17" fill="#35576b">访问</text><rect x="65" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="225" font-size="24" font-weight="600" fill="#173d55">doctor / get_status</text><text x="87" y="263" font-size="20" fill="#4d6170">诊断入口</text><rect x="505" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="527" y="225" font-size="24" font-weight="600" fill="#173d55">Channel 检查</text><text x="527" y="263" font-size="20" fill="#4d6170">候选后端顺序</text><rect x="945" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="225" font-size="24" font-weight="600" fill="#173d55">状态报告</text><text x="967" y="263" font-size="20" fill="#4d6170">ok / warn / error</text><rect x="65" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="500" font-size="24" font-weight="600" fill="#173d55">宿主 Agent</text><text x="87" y="538" font-size="20" fill="#4d6170">依据安装技能</text><rect x="505" y="455" width="340" height="140" rx="14" fill="#e8f2ed" stroke="#adbdc9" stroke-width="2" /><text x="527" y="500" font-size="24" font-weight="600" fill="#173d55">上游 CLI / MCP</text><text x="527" y="538" font-size="20" fill="#4d6170">执行实际访问</text><rect x="945" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="500" font-size="24" font-weight="600" fill="#173d55">外部内容平台</text><text x="967" y="538" font-size="20" fill="#4d6170">返回内容或错误</text><line x1="65" y1="690" x2="1395" y2="690" stroke="#ccd6df"/><text x="65" y="730" font-size="21" fill="#3c5465">配置文件原子替换；诊断为可用不等于每个真实请求成功。</text><text x="65" y="770" font-size="17" fill="#6c7e8c">固定源码分析 · 实线箭头表示标注的调用或数据传递；图不表示真实时间比例。</text></g></svg>