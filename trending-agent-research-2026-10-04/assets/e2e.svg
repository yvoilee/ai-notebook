<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#41718b"/></marker></defs><rect width="1460" height="800" fill="#f5f7fa"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="65" y="65" font-size="32" font-weight="600" fill="#172c40">e2e · 后续断言确认动作缓存</text><text x="65" y="112" font-size="21" fill="#4d6170">图中流程为首次录制；后续运行可尝试轨迹回放</text><path d="M405 250H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="228" font-size="17" fill="#35576b">缓存未命中</text><path d="M845 250H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="228" font-size="17" fill="#35576b">步骤成功</text><path d="M1115 320V385H235V443" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="510" y="373" font-size="17" fill="#35576b">继续测试</text><path d="M405 525H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="503" font-size="17" fill="#35576b">记录验证边界</text><path d="M845 525H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="503" font-size="17" fill="#35576b">确认后持久化</text><rect x="65" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="225" font-size="24" font-weight="600" fill="#173d55">agent.act</text><text x="87" y="263" font-size="20" fill="#4d6170">验证输入与预算</text><rect x="505" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="527" y="225" font-size="24" font-weight="600" fill="#173d55">executor + 引擎</text><text x="527" y="263" font-size="20" fill="#4d6170">观察 / 执行动作</text><rect x="945" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="225" font-size="24" font-weight="600" fill="#173d55">staged trace</text><text x="967" y="263" font-size="20" fill="#4d6170">内存候选轨迹</text><rect x="65" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="500" font-size="24" font-weight="600" fill="#173d55">后续验证步骤</text><text x="87" y="538" font-size="20" fill="#4d6170">确定性断言或 Agent 判断</text><rect x="505" y="455" width="340" height="140" rx="14" fill="#e8f2ed" stroke="#adbdc9" stroke-width="2" /><text x="527" y="500" font-size="24" font-weight="600" fill="#173d55">attempt 结算</text><text x="527" y="538" font-size="20" fill="#4d6170">lastVerifiedStepIndex</text><rect x="945" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="500" font-size="24" font-weight="600" fill="#173d55">缓存 store</text><text x="967" y="538" font-size="20" fill="#4d6170">确认才写入 / 保留</text><line x1="65" y1="690" x2="1395" y2="690" stroke="#ccd6df"/><text x="65" y="730" font-size="21" fill="#3c5465">中断不 flush；模型不可达不直接归咎于轨迹；回放本身不替代后续断言。</text><text x="65" y="770" font-size="17" fill="#6c7e8c">固定源码分析 · 实线箭头表示标注的调用或数据传递；图不表示真实时间比例。</text></g></svg>