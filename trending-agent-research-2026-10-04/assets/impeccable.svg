<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#41718b"/></marker></defs><rect width="1460" height="800" fill="#f5f7fa"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="65" y="65" font-size="32" font-weight="600" fill="#172c40">Impeccable · 整库检查与写前 gate</text><text x="65" y="112" font-size="21" fill="#4d6170">共享检测能力，但退出与拒绝语义不同</text><path d="M405 250H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="228" font-size="17" fill="#35576b">调用</text><path d="M845 250H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="228" font-size="17" fill="#35576b">输出</text><path d="M405 525H493" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="414" y="503" font-size="17" fill="#35576b">解析</text><path d="M845 525H933" fill="none" stroke="#41718b" stroke-width="2.5"  marker-end="url(#a)"/><text x="854" y="503" font-size="17" fill="#35576b">决定</text><rect x="65" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="225" font-size="24" font-weight="600" fill="#173d55">CLI detect</text><text x="87" y="263" font-size="20" fill="#4d6170">选择文件 / URL 范围</text><rect x="505" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="527" y="225" font-size="24" font-weight="600" fill="#173d55">Rust 检测器</text><text x="527" y="263" font-size="20" fill="#4d6170">规则与配置</text><rect x="945" y="180" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="225" font-size="24" font-weight="600" fill="#173d55">扫描报告</text><text x="967" y="263" font-size="20" fill="#4d6170">问题与运行错误分开</text><rect x="65" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="87" y="500" font-size="24" font-weight="600" fill="#173d55">宿主写前 hook</text><text x="87" y="538" font-size="20" fill="#4d6170">拟写入操作</text><rect x="505" y="455" width="340" height="140" rx="14" fill="#e8f2ed" stroke="#adbdc9" stroke-width="2" /><text x="527" y="500" font-size="24" font-weight="600" fill="#173d55">重建拟写入内容</text><text x="527" y="538" font-size="20" fill="#4d6170">运行相关检查</text><rect x="945" y="455" width="340" height="140" rx="14" fill="white" stroke="#adbdc9" stroke-width="2" /><text x="967" y="500" font-size="24" font-weight="600" fill="#173d55">JSON 决策</text><text x="967" y="538" font-size="20" fill="#4d6170">允许 / 拒绝；含降级规则</text><line x1="65" y1="690" x2="1395" y2="690" stroke="#ccd6df"/><text x="65" y="730" font-size="21" fill="#3c5465">gate 的 fail-open 与重复拒绝放行意味着它不是不可绕过的安全边界。</text><text x="65" y="770" font-size="17" fill="#6c7e8c">固定源码分析 · 实线箭头表示标注的调用或数据传递；图不表示真实时间比例。</text></g></svg>