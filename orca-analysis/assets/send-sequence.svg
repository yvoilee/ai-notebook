<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#425b72"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,Arial,sans-serif;fill:#183044} .title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#516a80}.label{font-size:23px;font-weight:600}.body{font-size:19px}.small{font-size:18px}</style><text x="45" y="55" class="title">结构化消息：接收、投递和结果是三个时刻</text><text x="45" y="92" class="sub">说明性示例；响应与后台投递可交错，图示一种顺序，省略鉴权与非核心字段</text><rect x="15" y="125" width="240" height="65" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="35" y="159" class="label">客户端</text><path d="M 135 190 V 980" stroke="#acbcc9" stroke-width="2" stroke-dasharray="6 7"/><rect x="350" y="125" width="240" height="65" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="370" y="159" class="label">Session Host</text><path d="M 470 190 V 980" stroke="#acbcc9" stroke-width="2" stroke-dasharray="6 7"/><rect x="735" y="125" width="240" height="65" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="755" y="159" class="label">SQLite Journal</text><path d="M 855 190 V 980" stroke="#acbcc9" stroke-width="2" stroke-dasharray="6 7"/><rect x="1140" y="125" width="240" height="65" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="1160" y="159" class="label">Provider Adapter</text><path d="M 1260 190 V 980" stroke="#acbcc9" stroke-width="2" stroke-dasharray="6 7"/><path d="M 135 235 H 468" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="150" y="219" class="small">send：sessionId + clientOperationId + body</text><text x="490" y="273" class="body">按会话串行；核对指纹、操作账本与 fence</text><path d="M 470 330 H 852" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="492" y="314" class="small">appendSubmission</text><rect x="735" y="350" width="245" height="69" rx="8" fill="#dbefdf"/><text x="750" y="378" class="body">COMMIT：queued</text><text x="750" y="403" class="small">消息已记录，尚未投递</text><path d="M 470 452 H 138" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="155" y="435" class="small">返回接收结果 + cursor / fence</text><text x="490" y="494" class="body">接收后异步 wakeDelivery；启动或复用 Provider 子进程</text><path d="M 470 555 H 852" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="485" y="538" class="small">先写 dispatch=pending 并提交</text><path d="M 470 625 H 1257" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="580" y="608" class="small">handOverSubmission → adapter.dispatch</text><path d="M 1260 694 H 473" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="584" y="677" class="small">accepted / rejected / unknown（异常）</text><path d="M 470 765 H 852" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="515" y="748" class="small">记录投递状态</text><path d="M 1260 837 H 473" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="585" y="820" class="small">后续消息、工具和轮次事件</text><path d="M 470 885 H 852" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="494" y="870" class="small">追加 journal 后向订阅者发布</text><path d="M 470 943 H 138" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="184" y="928" class="small">增量事件 / 状态</text><text x="45" y="1020" class="sub">同一消息 ID 重试只重放记录；unknown 不证明未送达，因此不会自动再次投递。</text></svg>