<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#425b72"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,Arial,sans-serif;fill:#183044} .title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#516a80}.label{font-size:23px;font-weight:600}.body{font-size:19px}.small{font-size:18px}</style><text x="45" y="55" class="title">Orca：控制入口与执行归属</text><text x="45" y="92" class="sub">本文按职责归纳；外框表示归属，实线表示调用，虚线表示事件或状态流</text><rect x="40" y="130" width="420" height="155" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="60" y="164" class="label">客户端</text><text x="60" y="196" class="body">桌面 Renderer / Web / Mobile</text><text x="60" y="225" class="body">显示终端、聊天与工作区</text><text x="60" y="254" class="body">保存呈现偏好，不判定远端进程死亡</text><rect x="40" y="350" width="420" height="185" rx="12" fill="#e9f1fa" stroke="#a6b8c7" stroke-width="2"/><text x="60" y="384" class="label">目标 Orca Runtime</text><text x="60" y="416" class="body">CLI 经 RPC；桌面也有 IPC 入口</text><text x="60" y="445" class="body">创建工作区、选择执行主机</text><text x="60" y="474" class="body">管理会话、状态和编排接口</text><path d="M 250 285 V 348" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="265" y="325" class="small">请求 / 订阅</text><rect x="550" y="125" width="850" height="685" rx="18" fill="#edf6f1" stroke="#709b85" stroke-width="2"/><text x="580" y="165" class="label">执行状态与持有者：本图与目标 Runtime 同属一个主机</text><rect x="585" y="205" width="365" height="155" rx="12" fill="#fff" stroke="#a6b8c7" stroke-width="2"/><text x="605" y="239" class="label">PTY 执行路径</text><text x="605" y="271" class="body">Daemon → TerminalHost → Session</text><text x="605" y="300" class="body">Shell / CLI Agent</text><text x="605" y="329" class="body">活进程 + 终端模拟器</text><rect x="1000" y="205" width="365" height="155" rx="12" fill="#fff" stroke="#a6b8c7" stroke-width="2"/><text x="1020" y="239" class="label">结构化会话路径</text><text x="1020" y="271" class="body">StructuredAgentSessionHost</text><text x="1020" y="300" class="body">投递循环 → Provider Adapter</text><text x="1020" y="329" class="body">会话与 Provider 子进程分离</text><path d="M 460 395 H 515 V 280 H 582" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="464" y="378" class="small">选择路径</text><path d="M 515 380 H 980 V 280 H 997" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="585" y="435" width="365" height="140" rx="12" fill="#fff" stroke="#a6b8c7" stroke-width="2"/><text x="605" y="469" class="label">终端快照与历史</text><text x="605" y="501" class="body">ANSI、模式、尺寸、输出位置</text><text x="605" y="530" class="body">保存画面不等于保存进程</text><rect x="1000" y="435" width="365" height="140" rx="12" fill="#fff" stroke="#a6b8c7" stroke-width="2"/><text x="1020" y="469" class="label">结构化 Journal</text><text x="1020" y="501" class="body">SQLite WAL + FULL</text><text x="1020" y="530" class="body">先提交消息记录，再向 Provider 投递</text><path d="M 768 360 V 432" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="785" y="402" class="small">快照 / 输出记录</text><path d="M 1182 360 V 432" fill="none" stroke="#425b72" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1196" y="402" class="small">先写记录</text><rect x="650" y="650" width="645" height="115" rx="12" fill="#fff" stroke="#a6b8c7" stroke-width="2"/><text x="670" y="684" class="label">Hook Server / 状态存储</text><text x="670" y="716" class="body">结构化会话有完整作用域；PTY 证据仍经 legacy adapter</text><path d="M 585 320 H 567 V 705 H 647" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 1365 320 H 1380 V 705 H 1298" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 650 745 H 490 V 470 H 463" fill="none" stroke="#425b72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="496" y="731" class="small">状态发布</text><rect x="40" y="855" width="1360" height="130" rx="12" fill="#fff3df" stroke="#a6b8c7" stroke-width="2"/><text x="60" y="889" class="label">直接 SSH 是另一种归属关系</text><text x="60" y="921" class="body">客户端 Runtime → SSH relay → 远端 PTY；远端 orca shim 的控制请求仍回到客户端。</text><text x="60" y="950" class="body">与上图的远端独立 Runtime 区分；cloud/ 手机中继也不是 src/relay 的 SSH 执行代理。</text></svg>